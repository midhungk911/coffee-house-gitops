name: Build and Deploy Coffee House

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write
  packages: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/midhungk911/coffee-house-gitops:${{ github.sha }}

      - name: Update Kubernetes image
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("k8s/deployment.yaml")
          content = file.read_text()

          old = "image: ghcr.io/midhungk911/coffee-house-gitops:"
          lines = content.splitlines()

          for i, line in enumerate(lines):
              if line.strip().startswith(old):
                  lines[i] = f"          {old}${{ github.sha }}"
                  break

          file.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml
          git commit -m "Update Coffee House image to ${{ github.sha }}" || exit 0
          git push
