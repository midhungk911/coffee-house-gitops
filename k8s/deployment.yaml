apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-house
  labels:
    app: coffee-house
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-house
  template:
    metadata:
      labels:
        app: coffee-house
    spec:
      containers:
        - name: coffee-house
          image: ghcr.io/midhungk911/coffee-house-gitops:latest
          ports:
            - containerPort: 5002
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 20
